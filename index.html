 تعیین سن بعضی مواد آلی با روش سن‌یابی پرتوزایی به کار می‌رود.","نیتروژن گازی بی‌رنگ و کم‌واکنش است و حدود چهارپنجم هوای زمین را تشکیل می‌دهد. بخش مهمی از پروتئین‌ها و اسیدهای نوکلئیک نیز از ترکیبات نیتروژن‌دار ساخته شده است. نیتروژن در تولید آمونیاک و کودهای شیمیایی، صنایع غذایی و ایجاد جو بی‌اثر در بعضی فرایندهای صنعتی کاربرد دارد. مولکول N₂ به دلیل پیوند سه‌گانه بسیار پایدار است.","اکسیژن نافلزی بسیار واکنش‌پذیر است و برای تنفس هوازی بیشتر جانداران ضروری است. حدود یک‌پنجم جو زمین را تشکیل می‌دهد و در احتراق نیز نقش مهمی دارد، هرچند خودِ اکسیژن سوخت محسوب نمی‌شود. اکسیژن در پزشکی، جوشکاری، فولادسازی و بسیاری از فرایندهای صنعتی مصرف می‌شود. شکل مولکولی رایج آن O₂ و شکل مهم دیگرش اوزون O₃ است.","فلوئور فعال‌ترین هالوژن و یکی از واکنش‌پذیرترین عناصر شناخته‌شده است. در طبیعت به صورت آزاد یافت نمی‌شود و بیشتر در ترکیبات معدنی حضور دارد. فلوریدها در خمیردندان و بعضی مواد صنعتی استفاده می‌شوند و ترکیبات فلوئوردار در فناوری‌های گوناگون اهمیت دارند. گاز F₂ بسیار خورنده و خطرناک است و با بسیاری از مواد به سرعت واکنش می‌دهد.","نئون گازی نجیب، بی‌رنگ و بسیار کم‌واکنش است. هنگامی که جریان الکتریکی از گاز نئون عبور کند، نور قرمز-نارنجی مشخصی تولید می‌شود؛ به همین دلیل در تابلوهای نوری و برخی لامپ‌های تخلیه کاربرد داشته است. نئون در هوا مقدار بسیار کمی دارد و به صورت گاز تک‌اتمی وجود دارد. در دمای اتاق مایع یا جامد نیست.","سدیم فلزی قلیایی، نرم و بسیار واکنش‌پذیر است و در طبیعت بیشتر به شکل ترکیب دیده می‌شود. یون Na⁺ در نمک خوراکی و بسیاری از فرایندهای زیستی نقش دارد و سدیم برای تنظیم تعادل آب و پیام‌رسانی عصبی ضروری است. فلز سدیم با آب واکنش شدیدی دارد و به همین دلیل به صورت فلز آزاد نگهداری آن نیازمند شرایط مناسب است. ترکیبات سدیم در صنایع شیمیایی و غذایی بسیار پرکاربردند.","منیزیم فلزی قلیایی‌خاکی و نسبتاً سبک است. این عنصر در آلیاژهای سبک، ساخت بعضی قطعات صنعتی و مواد آتش‌زا و نورزا کاربرد دارد و ترکیبات آن در بدن نیز نقش زیستی مهمی دارند. منیزیم در مرکز مولکول کلروفیل قرار گرفته و برای فتوسنتز گیاهان ضروری است. فلز منیزیم می‌تواند هنگام سوختن نور سفید و شدیدی تولید کند.","آلومینیوم فلزی سبک با چگالی کم است که به کمک لایهٔ اکسیدی سطح خود در برابر خوردگی مقاومت خوبی نشان می‌دهد. در ساخت هواپیما، خودرو، قوطی‌ها، کابل‌ها و بسیاری از سازه‌ها استفاده می‌شود. آلومینیوم رسانای مناسب گرما و برق است و به‌راحتی با فلزهای دیگر آلیاژ می‌سازد. یون رایج آن Al³⁺ است و سنگ معدن مهم آن بوکسیت است.","سیلیسیم یک شبه‌فلز مهم و یکی از عناصر فراوان پوستهٔ زمین است. این عنصر پایهٔ بسیاری از نیمه‌رساناهاست و در تراشه‌ها، سلول‌های خورشیدی و تجهیزات الکترونیکی کاربرد اساسی دارد. دی‌اکسید سیلیسیم و سیلیکات‌ها نیز در شن، شیشه، سنگ‌ها و مواد ساختمانی فراوان‌اند. سیلیسیم در فناوری مدرن به دلیل توانایی کنترل رسانایی الکتریکی اهمیت ویژه‌ای دارد.","فسفر نافلزی است که در طبیعت عمدتاً به صورت فسفات‌ها دیده می‌شود. این عنصر در DNA، RNA، ATP و ساخت استخوان‌ها و دندان‌ها از نظر زیستی اهمیت دارد. ترکیبات فسفر در کودهای کشاورزی، شوینده‌ها و صنایع شیمیایی کاربرد دارند. فسفر چند شکل ساختاری دارد و فسفر سفید نسبت به فسفر قرمز واکنش‌پذیرتر و خطرناک‌تر است.","گوگرد نافلزی زردرنگ است که در طبیعت به صورت آزاد و همچنین در بسیاری از کانی‌ها و ترکیبات وجود دارد. در تولید اسید سولفوریک، کودها، لاستیک و مواد شیمیایی گوناگون مصرف می‌شود. گوگرد در برخی پروتئین‌های بدن نیز حضور دارد. هنگام سوختن، گازهای گوگردی تولید می‌شوند که در صورت کنترل‌نشدن می‌توانند به آلودگی هوا و باران اسیدی کمک کنند.","کلر یک هالوژن واکنش‌پذیر است و در شرایط معمول به صورت گاز Cl₂ دیده می‌شود. یون کلرید در بدن نقش مهمی دارد و نمک خوراکی یکی از شناخته‌شده‌ترین ترکیبات آن است. کلر برای گندزدایی آب و تولید پلاستیک‌ها، حلال‌ها و مواد شیمیایی مختلف استفاده می‌شود. گاز کلر در غلظت‌های بالا سمی و تحریک‌کنندهٔ دستگاه تنفسی است.","آرگون گازی نجیب و بسیار کم‌واکنش است که در هوا وجود دارد. از آن به عنوان گاز محافظ در جوشکاری و برخی فرایندهای فلزی و همچنین در بعضی لامپ‌ها استفاده می‌شود تا مواد حساس کمتر با اکسیژن واکنش دهند. آرگون بی‌رنگ و بی‌بو است و در شرایط معمول به صورت گاز تک‌اتمی وجود دارد. واکنش‌پذیری پایین آن مهم‌ترین ویژگی کاربردی این عنصر است.","پتاسیم فلزی قلیایی و بسیار واکنش‌پذیر است. یون K⁺ در سلول‌های زنده برای تنظیم پیام‌های عصبی، فعالیت ماهیچه‌ها و تعادل یونی اهمیت دارد و ترکیبات پتاسیم در کودهای کشاورزی فراوان مصرف می‌شوند. فلز پتاسیم با آب به شدت واکنش نشان می‌دهد و معمولاً به صورت ترکیب در طبیعت وجود دارد. شعلهٔ ترکیبات پتاسیم رنگ بنفش کم‌رنگ می‌تواند ایجاد کند.","کلسیم فلزی قلیایی‌خاکی است و ترکیبات آن در سنگ آهک، گچ و بسیاری از مواد معدنی یافت می‌شوند. در بدن انسان، یون Ca²⁺ در ساخت استخوان و دندان، انقباض ماهیچه و انتقال پیام سلولی نقش دارد. ترکیبات کلسیم در سیمان، آهک، گچ و صنایع ساختمانی اهمیت زیادی دارند. فلز کلسیم از نظر شیمیایی فعال است ولی از بسیاری از فلزهای قلیایی کمتر واکنش‌پذیر است.","اسکاندیم فلزی واسطه و نسبتاً کمیاب است. بخش زیادی از کاربردهای آن در آلیاژهای ویژه، بعضی چراغ‌های تخلیه و تجهیزات هوافضایی متمرکز شده است. افزودن مقدار کمی اسکاندیم به برخی آلیاژهای آلومینیوم می‌تواند ویژگی‌های مکانیکی آن‌ها را بهبود دهد. در طبیعت معمولاً در مقادیر پراکنده همراه با کانی‌های دیگر فلزات کمیاب یافت می‌شود.","تیتانیم فلزی واسطه، سبک، محکم و مقاوم در برابر خوردگی است. مقاومت بالا نسبت به وزن باعث شده در هوافضا، پزشکی، تجهیزات ورزشی و صنایع شیمیایی کاربرد داشته باشد. تیتانیم و آلیاژهای آن در ساخت برخی ایمپلنت‌ها نیز استفاده می‌شوند. دی‌اکسید تیتانیم TiO₂ رنگدانهٔ سفید مهمی است و در رنگ‌ها، پوشش‌ها و مواد گوناگون مصرف می‌شود.","وانادیم فلز واسطه‌ای است که بیشتر به دلیل نقش آن در ساخت آلیاژهای مقاوم شناخته می‌شود. افزودن وانادیم به فولاد می‌تواند سختی، استحکام و مقاومت آن را افزایش دهد و در ساخت ابزار و قطعات صنعتی مفید باشد. برخی ترکیبات وانادیم رنگ‌های متفاوتی دارند و در شیمی آزمایشگاهی جالب‌اند. وانادیم در طبیعت بیشتر همراه سنگ‌های معدنی و فلزهای دیگر یافت می‌شود.","کروم فلزی واسطه با ظاهر براق و مقاومت خوب در برابر خوردگی است. ترکیبات کروم در رنگدانه‌ها و فرایندهای صنعتی به کار رفته‌اند و فلز کروم در آبکاری برای ایجاد سطح سخت و براق استفاده می‌شود. کروم یکی از عناصر مهم فولاد زنگ‌نزن است و مقاومت آن را در برابر خوردگی افزایش می‌دهد. برخی حالت‌های اکسایش کروم، به‌ویژه کروم شش‌ظرفیتی، از نظر ایمنی و بهداشت اهمیت ویژه دارند.","منگنز فلزی واسطه است که نقش مهمی در تولید فولاد و آلیاژها دارد. دی‌اکسید منگنز در باتری‌های معمولی و برخی فرایندهای شیمیایی کاربرد دارد. منگنز در بدن نیز یک ریزمغذی ضروری برای بعضی آنزیم‌هاست، اما دریافت بیش از حد آن می‌تواند زیان‌آور باشد. این عنصر در طبیعت در کانی‌هایی مانند پیرولوزیت یافت می‌شود.","آهن یکی از مهم‌ترین فلزهای صنعتی و عنصر اصلی فولاد است. در پوستهٔ زمین فراوان است و هستهٔ زمین نیز مقدار زیادی آهن دارد. در بدن، آهن جزء مهم هموگلوبین است و برای جابه‌جایی اکسیژن لازم است. آهن می‌تواند در برابر اکسیژن و آب زنگ بزند، اما با آلیاژکردن آن مانند ساخت فولاد زنگ‌نزن می‌توان مقاومت به خوردگی را افزایش داد.","کبالت فلزی واسطه با کاربردهای مهم در آلیاژهای مقاوم، باتری‌ها، کاتالیزورها و بعضی رنگدانه‌هاست. ترکیبات کبالت می‌توانند رنگ‌های آبی مشخصی ایجاد کنند و به همین دلیل در شیشه و سرامیک نیز کاربرد داشته‌اند. کبالت در بدن به مقدار کم ضروری است، زیرا در ساختار ویتامین B۱۲ حضور دارد. منابع طبیعی آن معمولاً در کنار کانی‌های نیکل و مس قرار دارند.","نیکل فلزی واسطه، سخت و مقاوم در برابر خوردگی است. مقدار زیادی از نیکل در ساخت فولاد زنگ‌نزن و آلیاژهای مقاوم به گرما و خوردگی استفاده می‌شود. آبکاری نیکل می‌تواند سطح قطعات را مقاوم و براق کند و برخی باتری‌ها نیز از ترکیبات نیکل استفاده می‌کنند. بعضی افراد به تماس پوستی با نیکل حساسیت دارند.","مس فلزی با رسانایی بسیار خوب گرمایی و الکتریکی است و به همین دلیل یکی از فلزهای مهم در سیم‌ها و کابل‌هاست. مس و آلیاژهای آن مانند برنج و برنز در ساختمان، ابزارها، لوله‌ها و تجهیزات صنعتی کاربرد فراوان دارند. سطح مس در تماس با هوا به‌تدریج تغییر می‌کند و ممکن است لایهٔ سبزفامی ایجاد شود. یون‌های مس در مقدار کم برای بدن ضروری‌اند.","روی فلزی واسطه‌مانند است که در تولید آلیاژها و پوشش‌دهی آهن برای جلوگیری از خوردگی کاربرد دارد. فرایند گالوانیزه‌کردن یکی از مهم‌ترین کاربردهای روی است. یون Zn²⁺ در بسیاری از آنزیم‌های بدن نقش دارد و روی در مواد غذایی به عنوان یک عنصر ضروری شناخته می‌شود. اکسید روی نیز در برخی کرم‌ها، رنگدانه‌ها و محصولات صنعتی و پزشکی استفاده می‌شود.","گالیم فلزی نسبتاً نرم است که نقطهٔ ذوب آن نزدیک دمای اتاق است؛ بنابراین می‌تواند در دست گرم به‌تدریج ذوب شود. ترکیبات گالیم در نیمه‌رساناها، LEDها و برخی لیزرها کاربرد دارند. گالیم می‌تواند برخی فلزها، به‌ویژه آلومینیوم، را تضعیف کند و به همین دلیل تماس آن با بعضی سازه‌ها مطلوب نیست. در طبیعت مقدار زیادی از آن به صورت همراه با کانی‌های آلومینیوم و روی یافت می‌شود.","ژرمانیم یک شبه‌فلز و نیمه‌رسانا است. در گذشته نقش مهمی در ترانزیستورهای اولیه داشت و امروزه در اپتیک فروسرخ، فیبر نوری و برخی تجهیزات الکترونیکی کاربرد دارد. دی‌اکسید ژرمانیم در ساخت شیشه‌های ویژه و فناوری فیبر نوری نیز اهمیت دارد. این عنصر در طبیعت کمیاب است و معمولاً به عنوان محصول جانبی فرآوری سنگ‌های روی و بعضی مواد معدنی به دست می‌آید.","آرسنیک شبه‌فلزی سمی است که در ترکیبات معدنی مختلف وجود دارد. برخی ترکیبات آرسنیک در گذشته در کشاورزی و صنعت استفاده شده‌اند، اما به علت سمیت بالا کاربرد آن‌ها محدود و تحت کنترل است. آرسنیک می‌تواند در محیط‌های طبیعی مانند آب‌های زیرزمینی نیز وجود داشته باشد. از نظر آموزشی مهم است بدانیم که شکل شیمیایی و مقدار تماس، نقش مهمی در میزان خطر آن دارد.","سلنیم نافلزی است که رفتار آن بین گوگرد و تلوریم قرار می‌گیرد و ویژگی‌های نیمه‌رسانایی دارد. در شیشه‌سازی، برخی تجهیزات الکترونیکی، سلول‌های نوری و مواد افزودنی کاربرد داشته است. سلنیم در مقدار بسیار کم برای بدن یک ریزمغذی ضروری است، اما مقدار زیاد آن می‌تواند زیان‌آور باشد. چند شکل ساختاری سلنیم خواص فیزیکی متفاوتی دارند.","برم هالوژنی است که در دمای اتاق به صورت مایع قرمز-قهوه‌ای و فرّار دیده می‌شود. این ویژگی باعث شده از نظر ظاهری میان هالوژن‌های گازی و جامد جالب باشد. ترکیبات برم در صنایع شیمیایی، برخی مواد بازدارندهٔ شعله و فرایندهای تخصصی کاربرد دارند. بخار برم تحریک‌کننده و خطرناک است و باید از استنشاق آن جلوگیری شود.","کریپتون گازی نجیب و بسیار کم‌واکنش است. در مقدار بسیار کم در جو وجود دارد و در بعضی لامپ‌های ویژه و کاربردهای نوری استفاده شده است. کریپتون در دما و فشار معمول گاز تک‌اتمی، بی‌رنگ و بی‌بو است. مانند دیگر گازهای نجیب، به دلیل کامل‌بودن لایهٔ بیرونی الکترونی واکنش‌پذیری شیمیایی پایینی دارد.","روبیدیم فلزی قلیایی، نرم و بسیار واکنش‌پذیر است. واکنش آن با آب می‌تواند شدید باشد و به همین دلیل فلز آزاد آن در شرا ل عنصر پایداری ندارد. تکنسیم-۹۹m در تصویربرداری پزشکی هسته‌ای برای بررسی اندام‌ها بسیار مهم بوده است. این عنصر به دلیل ویژگی‌های پرتوزایی بیشتر در کاربردهای تخصصی و پژوهشی استفاده می‌شود.","روتنیم فلزی واسطه از فلزات گروه پلاتین است و در برابر بسیاری از مواد شیمیایی مقاوم است. در برخی کاتالیزورها، پوشش‌های مقاوم، قطعات الکترونیکی و آلیاژها کاربرد دارد. ترکیبات روتنیم می‌توانند حالت‌های اکسایش گوناگونی داشته باشند. این عنصر در طبیعت معمولاً همراه دیگر فلزات گروه پلاتین یافت می‌شود.","رودیم فلزی از گروه پلاتین و بسیار مقاوم در برابر خوردگی است. یکی از کاربردهای مهم آن در کاتالیزورهای خودرو است که به کاهش برخی آلاینده‌های گازی کمک می‌کنند. رودیم فلزی نسبتاً کمیاب و گران است و در آبکاری و بعضی کاربردهای نوری نیز استفاده شده است. سطح براق آن و مقاومت شیمیایی بالا از ویژگی‌های مهم این عنصر است.","پالادیم فلزی از گروه پلاتین و کاتالیزگر توانمند است. در کاتالیزورهای خودرو، صنایع شیمیایی و برخی قطعات الکترونیکی کاربرد دارد و توانایی جذب هیدروژن آن نیز از ویژگی‌های شناخته‌شدهٔ آن است. پالادیم فلزی کمیاب است و به صورت طبیعی بیشتر همراه دیگر فلزهای گروه پلاتین یافت می‌شود. در بعضی جواهرات و آلیاژها نیز به کار می‌رود.","نقره فلزی براق و بهترین رسانای الکتریکی در میان فلزهای خالص است. در جواهرات، ظروف، قطعات الکترونیکی، تماس‌های الکتریکی و بعضی کاربردهای ضدباکتری استفاده می‌شود. نقره در برابر هوای معمول نسبتاً پایدار است اما ترکیبات گوگردی می‌توانند سطح آن را تیره کنند. یون‌های نقره و بعضی ترکیبات آن خاصیت ضد میکروبی دارند.","کادمیم فلزی نرم و سمی است که بیشتر در برخی باتری‌ها، آبکاری‌ها و مواد تخصصی صنعتی استفاده شده است. سمیت کادمیم باعث شده کاربرد آن در بسیاری از محصولات کاهش پیدا کند و استفاده از آن تحت مقررات ایمنی باشد. ترکیبات کادمیم می‌توانند رنگدانه‌های زرد و قرمز ایجاد کنند. این عنصر معمولاً به عنوان محصول جانبی استخراج روی به دست می‌آید.","ایندیم فلزی نرم و نسبتاً کمیاب است که به دلیل شفافیت و رسانایی بعضی ترکیباتش در فناوری نمایشگرها اهمیت دارد. اکسید ایندیم-قلع یا ITO در صفحه‌های لمسی و نمایشگرها به عنوان لایه‌ای رسانا و نسبتاً شفاف استفاده می‌شود. ایندیم در آلیاژهای ی استفاده می‌شد، اما خطر پرتوزایی آن باعث شد این کاربردها کنار گذاشته شوند. ایزوتوپ‌ها و محصولات واپاشی رادیم از نظر پرتوی اهمیت دارند. تماس با رادیم نیازمند کنترل جدی ایمنی و پرتویی است.","اکتینیم فلزی سنگین و پرتوزاست و نام خانوادهٔ آکتینیدها از آن گرفته شده است. مقدار طبیعی آن بسیار کم است و بیشتر در زنجیرهٔ واپاشی اورانیوم و توریم یافت می‌شود. اکتینیم-۲۲۷ در پژوهش‌های هسته‌ای و به عنوان منبع ذرات آلفا مورد بررسی قرار گرفته است. به دلیل پرتوزایی، کاربرد آن تخصصی و محدود است.","توریم فلزی سنگین و پرتوزا از خانوادهٔ آکتینیدهاست. توریم طبیعی عمدتاً شامل توریم-۲۳۲ است که بسیار دیر واپاشی می‌کند و در چرخه‌های سوخت هسته‌ای مورد مطالعه قرار گرفته است. این عنصر در کانی‌های طبیعی وجود دارد و از نظر زمین‌شناسی و هسته‌ای اهمیت دارد. مانند دیگر مواد پرتوزا، کار با ترکیبات توریم نیازمند کنترل مناسب است.","پروتاکتینیم عنصری پرتوزا و کمیاب از خانوادهٔ آکتینیدهاست. در زنجیرهٔ واپاشی اورانیوم به مقدار بسیار کم تشکیل می‌شود و به دلیل کمیابی و پرتوزایی کاربرد صنعتی گسترده‌ای ندارد. ایزوتوپ‌های پروتاکتینیم بیشتر در پژوهش‌های هسته‌ای و زمین‌شناسی بررسی می‌شوند. نام آن به معنای عنصری است که در زنجیرهٔ واپاشی پیش از اکتینیم قرار می‌گیرد.","اورانیم فلزی سنگین و پرتوزاست و یکی از شناخته‌شده‌ترین عناصر آکتینیدی به شمار می‌آید. اورانیم در پوستهٔ زمین یافت می‌شود و ایزوتوپ‌های آن در سوخت راکتورهای هسته‌ای و پژوهش‌های هسته‌ای اهمیت دارند. غلظت و ترکیب ایزوتوپی اورانیم برای کاربردهای مختلف اهمیت زیادی دارد. کار با اورانیم نیازمند کنترل هم پرتوی و هم شیمیایی است.","نپتونیم آکتینیدی مصنوعی و پرتوزاست که نخستین عنصر فراتر از اورانیم در ردیف عناصر مصنوعی بود. در طبیعت می‌تواند در مقادیر بسیار کم از فرایندهای هسته‌ای طبیعی به وجود آید، اما منابع اصلی آن مصنوعی‌اند. نپتونیم-۲۳۷ در پژوهش‌های چرخهٔ سوخت هسته‌ای و تولید بعضی رادیونوکلیدها اهمیت دارد. همهٔ ایزوتوپ‌های آن ناپایدارند.","پلوتونیم فلزی آکتینیدی و پرتوزاست که بیشتر به صورت مصنوعی در راکتورها تولید می‌شود. برخی ایزوتوپ‌های آن در انرژی هسته‌ای و سامانه‌های تخصصی به عنوان منبع انرژی یا در پژوهش‌ها کاربرد داشته‌اند. پلوتونیم چند حالت اکسایش دارد و شیمی آن پیچیده است. به دلیل پرتوزایی و سمیت، نگهداری و کار با آن در شرایط بسیار کنترل‌شده انجام می‌شود.","آمریکیم آکتینیدی مصنوعی و پرتوزاست. یکی از کاربردهای شناخته‌شدهٔ آن آمریکیم-۲۴۱ در برخی آشکارسازهای دود یونش‌دار است که از مقدار بسیار کمی مادهٔ پرتوزا استفاده می‌کنند. سایر کاربردهای آمریکیم بیشتر پژوهشی و تخصصی‌اند. همهٔ ایزوتوپ‌های آن ناپایدارند و کنترل پرتویی برای کار با آن ضروری است.","کوریم آکتینیدی مصنوعی و پرتوزاست که نامش از ماری و پی‌یر کوری گرفته شده است. برخی ایزوتوپ‌های کوریم در پژوهش‌های هسته‌ای و تولید سایر عناصر سنگین‌تر اهمیت دارند. کوریم در طبیعت به مقدار قابل توجه وجود ندارد و عمدتاً از واکنش‌های هسته‌ای به دست می‌آید. به دلیل پرتوزایی، کاربرد آن تقریباً کاملاً پژوهشی و تخصصی است.","برکلیم آکتینیدی مصنوعی و پرتوزاست و نام آن از شهر برکلی گرفته شده است. مقدار تولید آن بسیار کم است و بیشتر برای پژوهش دربارهٔ عناصر فوق‌سنگین و شیمی آکتینیدها استفاده می‌شود. ایزوتوپ‌های برکلیم همگی ناپایدارند. این عنصر کاربرد روزمره یا صنعتی معمولی ندارد.","کالیفرنیم آکتینیدی مصنوعی و بسیار پرتوزاست. کالیفرنیم-۲۵۲ یکی از منابع نوترونی شناخته‌شده است و در برخی کاربردهای تخصصی مانند بازرسی مواد و راه‌اندازی برخی فرایندهای هسته‌ای مورد استفاده قرار گرفته است. تولید آن دشوار و پرهزینه است و مقدار مصرفی آن بسیار کم است. همهٔ ایزوتوپ‌های کالیفرنیم ناپایدارند.","انیشتینیم آکتینیدی مصنوعی و پرتوزاست که به افتخار آلبرت اینشتین نام‌گذاری شده است. مقدار بسیار کمی از آن در آزمایش‌های هسته‌ای و راکتوری تولید می‌شود و مطالعهٔ آن به شناخت رفتار عناصر سنگین کمک می‌کند. انیشتینیم کاربرد صنعتی معمولی ندارد. همهٔ ایزوتوپ‌های آن ناپایدار و دارای نیمه‌عمرهای نسبتاً کوتاه‌اند.","فرمیم آکتینیدی مصنوعی و پرتوزاست که در مقادیر بسیار اندک تولید شده است. این عنصر عمدتاً برای مطالعهٔ هسته‌های سنگین و رفتار شیمیایی آکتینیدهای انتهایی مورد بررسی قرار می‌گیرد. فرمیم کاربرد روزمره یا صنعتی ندارد. همهٔ ایزوتوپ‌های آن ناپایدارند و نگهداری آن به آزمایشگاه‌های بسیار تخصصی نیاز دارد.","مندلیفیم آکتینیدی مصنوعی و پرتوزاست و به افتخار دیمیتری مندلیف نام‌گذاری شده است. مقدار تولید آن بسیار کم است و بیشتر در پژوهش‌های هسته‌ای برای بررسی رفتار عناصر سنگین استفاده می‌شود. ایزوتوپ‌های مندلیفیم عمر محدودی دارند و در طبیعت به صورت پایدار وجود ندارند. این عنصر بیشتر برای مطالعهٔ ساختار هسته و شیمی عناصر سنگین اهمیت دارد.","نوبلیم آکتینیدی مصنوعی و پرتوزاست و نام آن از آلفرد نوبل گرفته شده است. این عنصر تنها در مقدارهای بسیار کم تولید می‌شود و هدف اصلی از تولید آن مطالعهٔ عناصر سنگین و رفتار شیمیایی آکتینیدهاست. همهٔ ایزوتوپ‌های نوبلیم ناپایدارند. کاربرد صنعتی یا مصرف عمومی شناخته‌شده‌ای ندارد.","لارنسیم آکتینیدی مصنوعی و پرتوزاست و نامش از ارنست لارنس گرفته شده است. این عنصر در شتاب‌دهنده‌ها و آزمایش‌های هسته‌ای با مقدار بسیار کم ساخته می‌شود. مطالعهٔ لارنسیم برای بررسی مرزهای جدول تناوبی و شیمی عناصر سنگین اهمیت دارد. همهٔ ایزوتوپ‌های آن ناپایدارند و عمر کوتاهی دارند.","رادرفوردیم یکی از عناصر فوق‌سنگین مصنوعی و پرتوزاست که به افتخار ارنست رادرفورد نام‌گذاری شده است. تنها تعداد بسیار کمی از اتم‌های آن در آزمایشگاه تولید می‌شود و خیلی زود واپاشی می‌کند. ویژگی‌های شیمیایی آن بیشتر از طریق آزمایش‌های بسیار حساس یا پیش‌بینی‌های نظری بررسی می‌شود. کاربرد صنعتی یا روزمره‌ای برای آن وجود ندارد.","دوبنیم عنصر فوق‌سنگین مصنوعی و پرتوزاست که نامش به یک مرکز پژوهش هسته‌ای در روسیه مرتبط است. ایزوتوپ‌های آن ناپایدارند و فقط تعداد کمی از اتم‌های آن در آزمایشگاه تولید شده‌اند. مطالعهٔ دوبنیم برای شناخت شیمی و پایداری عناصر بسیار سنگین اهمیت دارد. این عنصر هیچ کاربرد مصرفی معمولی ندارد.","سیبورگیم عنصر فوق‌سنگین مصنوعی و پرتوزاست که به افتخار گلن سیبورگ نام‌گذاری شده است. این عنصر تنها در آزمایش‌های هسته‌ای و به مقدار بسیار ناچیز تولید می‌شود و عمر ایزوتوپ‌هایش کوتاه است. پژوهش دربارهٔ آن به بررسی ساختار هسته و روند تغییر خواص شیمیایی در عناصر فوق‌سنگین کمک می‌کند. کاربرد روزمره‌ای ندارد.","بوهریم عنصر فوق‌سنگین مصنوعی و پرتوزاست و به افتخار نیلز بور نام‌گذاری شده است. تنها مقدار بسیار کمی از آن در آزمایشگاه تولید شده و همهٔ ایزوتوپ‌های شناخته‌شدهٔ آن ناپایدارند. هدف اصلی مطالعهٔ بوهریم بررسی هسته‌های سنگین و خواص شیمیایی احتمالی آن است. کاربرد صنعتی یا عمومی ندارد.","هاسیم عنصر ف   ()=>({text:`برای ایزوتوپ ${nm(d)} با عدد جرمی ${N(isoA)}، اگر هسته ۲ نوترون از دست بدهد، عدد جرمی جدید چند می‌شود؟`,c:Math.max(z,isoA-2),o:numOpts(Math.max(z,isoA-2),z,250)}),
  ()=>({text:`یک یون ${nm(d)} دارای ${N(z-2)} الکترون و ${N(z)} پروتون است. بار یون چند است؟`,c:'+2',o:['+1','+2','−2','۰']}),
  ()=>({text:`اگر ${nm(d)} دو الکترون از دست بدهد و سپس یک الکترون دریافت کند، بار نهایی آن چیست؟`,c:'+1',o:['+1','−1','+2','۰']}),
  ()=>({text:`اگر تعداد پروتون‌های ${nm(d)} برابر ${N(z)} و نوترون‌ها برابر ${N(neut)} باشد، و ۳ نوترون اضافه شود، عدد جرمی جدید چند است؟`,c:z+neut+3,o:numOpts(z+neut+3,z,250)}),
  ()=>({text:`اتمی از ${nm(d)} عدد جرمی ${N(isoA)} و ${N(z+2)} الکترون دارد. عدد نوترون و بار یون به‌ترتیب کدام‌اند؟`,c:`نوترون=${neut} ، بار=−2`,o:[`نوترون=${neut+2} ، بار=−2`,`نوترون=${neut} ، بار=−2`,`نوترون=${neut} ، بار=+2`,`نوترون=${isoA} ، بار=۰`]}),
  ()=>({text:`دو ایزوتوپ ${nm(d)} به‌ترتیب ${N(neut)} و ${N(neut+2)} نوترون دارند. اختلاف عدد جرمی آن‌ها چند است؟`,c:2,o:['۱','۲','۳','۴']}),
  ()=>{const x=otherD();return{text:`اگر ${nm(d)} دارای ${N(z)} پروتون و ${nm(x)} دارای ${N(x.z)} پروتون باشد، اختلاف تعداد پروتون‌های آن‌ها چند است؟`,c:Math.abs(z-x.z),o:numOpts(Math.abs(z-x.z),1,117)}},
  ()=>({text:`اتم ${nm(d)} ابتدا ۲ الکترون از دست می‌دهد و سپس ۳ الکترون دریافت می‌کند. بار نهایی نسبت به اتم خنثی چیست؟`,c:'−1',o:['−1','+1','−2','+2']}),
  ()=>({text:`اگر عدد جرمی ${nm(d)} برابر ${N(isoA)} و تعداد نوترون‌ها ${N(neut)} باشد، با اضافه شدن ۲ پروتون و ۲ نوترون، عدد اتمی و جرمی جدید به‌ترتیب چه می‌شوند؟`,c:`Z=${z+2} ، A=${isoA+4}`,o:[`Z=${z+2} ، A=${isoA+4}`,`Z=${z+4} ، A=${isoA+2}`,`Z=${z} ، A=${isoA+4}`,`Z=${z+2} ، A=${isoA+2}`]}),
  ()=>({text:`کدام تغییر فقط عدد جرمی را تغییر می‌دهد و عدد اتمی را ثابت نگه می‌دارد؟`,c:'افزودن یک نوترون',o:['افزودن یک پروتون','افزودن یک نوترون','افزودن یک الکترون','حذف یک پروتون']}),
  ()=>({text:`کدام تغییر یک عنصر را به عنصر دیگری تبدیل می‌کند؟`,c:'تغییر تعداد پروتون‌ها',o:['تغییر تعداد الکترون‌ها','تغییر تعداد نوترون‌ها','تغییر تعداد پروتون‌ها','تغییر حالت فیزیکی']}),
  ()=>({text:`اگر یک اتم ${nm(d)} دارای ${N(z)} پروتون، ${N(neut)} نوترون و ${N(z-1)} الکترون باشد، مجموع ذرات هسته‌ای آن چند است؟`,c:z+neut,o:numOpts(z+neut,1,250)})
 ];
 const bank=level==='easy'?easy:level==='medium'?medium:level==='hard'?hard:expert;
 let q=bank[Math.floor(Math.random()*bank.length)]();
 q.o=uniqOpts(q.c,q.o||[]);
 if(q.o.length<4){const filler=typeof q.c==='number'?numOpts(q.c,0,250):['گزینهٔ دیگر','اطلاعات کافی نیست','هیچ‌کدام'];q.o=uniqOpts(q.c,q.o.concat(filler))}
 return {z,text:q.text,c:q.c,o:q.o,level};
}
function begin(a,b,c,level='easy'){const pool=[];for(let z=a;z<=b;z++)pool.push(z);let arr=[],seen=new Set(),tries=0;while(arr.length<c&&tries<c*80){const z=pool[Math.floor(Math.random()*pool.length)],q=makeQ(z,pool,level),sig=q.text+'|'+q.c;if(!seen.has(sig)){seen.add(sig);arr.push(q)}tries++}while(arr.length<c){const q=makeQ(pool[Math.floor(Math.random()*pool.length)],pool,level);arr.push(q)}Q={f:a,o:b,n:c,l:arr,i:0,s:0,k:null,p:1,level};qUI()}
function start(){const cl=(v,lo,hi,df)=>Math.min(hi,Math.max(lo,parseInt(v)||df));let a=cl($('#f').value,1,118,1),b=cl($('#o').value,1,118,118),c=cl($('#n').value,5,100,20),level=Q.level||'easy';if(a>b)[a,b]=[b,a];if(b-a<3){Q={...Q,f:a,o:b,n:c,p:0};qUI();$('#er').textContent=T[lang].er;return}begin(a,b,c,level)}
function pickA(v){if(Q.k!==null)return;const c=Q.l[Q.i];Q.k=v;if(String(v)===String(c.c))Q.s++;qUI();setTimeout(()=>{if(Q.p!=1)return;Q.k=null;if(Q.i>=Q.l.length-1)Q.p=2;else Q.i++;qUI()},1300)}
function qUI(){const t=T[lang],n=Q.l?Q.l.length:0;let h;
if(Q.p==0)h=`<div class="qc"><h2>${t.qz}</h2><label>${t.fr}<input id="f" type="number" inputmode="numeric" min="1" max="118" value="${Q.f||1}"></label><label>${t.to}<input id="o" type="number" inputmode="numeric" min="1" max="118" value="${Q.o||36}"></label><label>${t.cn}<input id="n" type="number" inputmode="numeric" min="5" max="100" value="${Q.n||20}"></label><div class="difficulty-box"><b>سطح سوالات</b><div class="difficulty-buttons"><button type="button" class="diff-btn easy ${Q.level==='easy'?'active':''}" data-level="easy">🟢 آسان</button><button type="button" class="diff-btn medium ${Q.level==='medium'?'active':''}" data-level="medium">🟡 متوسط</button><button type="button" class="diff-btn hard ${Q.level==='hard'?'active':''}" data-level="hard">🟠 سخت</button><button type="button" class="diff-btn expert ${Q.level==='expert'?'active':''}" data-level="expert">🔴 در حد دانشمند</button><button type="button" class="diff-btn extreme ${Q.level==='extreme'?'active':''}" data-level="extreme">🟣 فوق‌سخت (حداکثر)</button><button type="button" class="diff-btn impossible ${Q.level==='impossible'?'active':''}" data-level="impossible">⚫ غیرممکن (جهنمی)</button></div></div><p class="er" id="er"></p><button class="pr" id="go">${t.go}</button></div>`;
else if(Q.p==1){const c=Q.l[Q.i],a=Q.k!==null;h=`<div class="qc"><div class="meta"><span>${N(Q.i+1)} / ${N(n)}</span><span>${IC.star} ${N(Q.s)}</span></div><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><div class="sm" style="margin-bottom:8px">سطح: <b>${QLEVEL[Q.level][lang]}</b></div><h3>${c.text}</h3>${c.o.map(v=>`<button class="op${a?String(v)===String(c.c)?' ok':String(v)===String(Q.k)?' no':'':''}" data-v="${encodeURIComponent(String(v))}">${v}</button>`).join('')}${a?`<p class="fb">${String(Q.k)===String(c.c)?t.ok:t.bad+' '+c.c}</p>`:''}</div>`}
else h=`<div class="qc" style="text-align:center"><h2>${t.sc}</h2><div class="big">${N(Q.s)} / ${N(n)}</div><p class="bigstar">${IC.star}</p><p>سطح: <b>${QLEVEL[Q.level][lang]}</b></p><button class="pr" id="ag">${t.again}</button><button class="pr alt" id="nq">${t.nw}</button></div>`;
$('#qz').innerHTML=h}
$('#qz').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.level){Q.level=b.dataset.level;qUI();return}if(b.id=='go')start();else if(b.id=='ag')begin(Q.f,Q.o,Q.n,Q.level);else if(b.id=='nq'){Q.p=0;qUI()}else if(b.dataset.v)pickA(decodeURIComponent(b.dataset.v))};

// چرخش مستقیم هر الکترون با تغییر cx/cy؛ برای ۱ الکترون هم کاملاً قابل مشاهده است
(function(){
  let last=performance.now();
  function tick(now){
    const dt=Math.min(64,now-last); last=now;
    document.querySelectorAll('.moving-electron').forEach(el=>{
      const R=parseFloat(el.dataset.radius)||62;
      const dur=Math.max(.8,parseFloat(el.dataset.duration)||3.2);
      let a=parseFloat(el.dataset.angle)||0;
      a=(a + dt*2*Math.PI/(dur*1000))%(2*Math.PI);
      el.dataset.angle=a.toFixed(6);
      el.setAttribute('cx',(R*Math.cos(a)).toFixed(2));
      el.setAttribute('cy',(R*Math.sin(a)).toFixed(2));
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
theme(ld('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
setLang(ld('lang')||'fa');
