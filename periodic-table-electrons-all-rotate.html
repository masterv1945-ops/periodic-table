else if(Q.p==1){const c=Q.l[Q.i],d=D[c.z-1],x=c.ty==3?N(c.z):c.ty==0?d.s:nm(d),a=Q.k!==null;
h=`<div class="qc"><div class="meta"><span>${N(Q.i+1)} / ${N(n)}</span><span>${IC.star} ${N(Q.s)}</span></div><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><h3>${t.q[c.ty](x)}</h3>${c.o.map(v=>`<button class="op${a?v==c.c?' ok':v==Q.k?' no':'':''}" data-v="${v}">${lb(c.ty,v)}</button>`).join('')}${a?`<p class="fb">${Q.k==c.c?t.ok:t.bad+' '+lb(c.ty,c.c)}</p>`:''}</div>`}
else h=`<div class="qc" style="text-align:center"><h2>${t.sc}</h2><div class="big">${N(Q.s)} / ${N(n)}</div><p class="bigstar">${IC.star}</p><button class="pr" id="ag">${t.again}</button><button class="pr alt" id="nq">${t.nw}</button></div>`;
$('#qz').innerHTML=h}
$('#qz').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='go')start();else if(b.id=='ag')begin(Q.f,Q.o,Q.n);else if(b.id=='nq'){Q.p=0;qUI()}else if(b.dataset.v)pickA(+b.dataset.v)};

// چرخش مستقیم هر الکترون با تغییر cx/cy؛ برای ۱ الکترون هم کاملاً قابل مشاهده است
(function(){
  let last=performance.now();
  function tick(now){
    const dt=Math.min(64,now-last); last=now;
    document.querySelectorAll('.moving-electron').forEach(el=>{
      const R=parseFloat(el.dataset.radius)||62;
      const dur=Math.max(.8,parseFloat(el.dataset.duration)||3.2);
      let a=parseFloat(el.dataset.angle)||0;
      a=(a + dt*2*Math.PI/(dur*1000))%(2*Math.PI);
      el.dataset.angle=a.toFixed(6);
      el.setAttribute('cx',(R*Math.cos(a)).toFixed(2));
      el.setAttribute('cy',(R*Math.sin(a)).toFixed(2));
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
theme(ld('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
setLang(ld('lang')||'fa');
</script>
